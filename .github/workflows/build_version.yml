name: 'build version'
run-name: 'build for version ${{ inputs.download_version }}${{ github.event.client_payload.download_version }}'

on:
  workflow_dispatch:
    inputs:
      download_version:
        description: 'papermc server version'
        required: true
        default: '1.20.6'

  repository_dispatch:
    types: [ build_version ]

jobs:
  buid_version:
    name: build version
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: checkout the repo
        uses: actions/checkout@v4

      # ⭐️ Holt Version aus workflow_dispatch oder repository_dispatch payload
      - name: set version
        run: echo "BASE_VERSION=${{ inputs.download_version }}${{ github.event.client_payload.download_version }}" >> $GITHUB_ENV

      # ⭐️ NEUE API – findet latest STABLE build (mit Fallback auf RC/experimental)
      - name: get latest Paper build (stable preferred)
        id: get_build
        run: |
          PROJECT="paper"
          USER_AGENT="docker-minecraft-papermc-server ([email protected])"

          # 1️⃣ Neueste MC Version abfragen (falls BASE_VERSION=latest)
          if [[ "${BASE_VERSION}" == "latest" ]]; then
            BASE_VERSION=$(curl -s -H "User-Agent: $USER_AGENT" \
              https://fill.papermc.io/v3/projects/${PROJECT} \
              | jq -r '.versions | to_entries[0] | .value[0]')
          fi

          echo "Using version: $BASE_VERSION"
          echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_ENV

          # 2️⃣ Latest *stable* build suchen:
          LATEST_BUILD=$(curl -s -H "User-Agent: $USER_AGENT" \
            "https://fill.papermc.io/v3/projects/${PROJECT}/versions/${BASE_VERSION}/builds" \
            | jq -r 'map(select(.channel == "STABLE")) | .[0] | .build')

          # 3️⃣ Fallback: Wenn kein stabiler Build → experimental nehmen
          if [[ -z "$LATEST_BUILD" || "$LATEST_BUILD" == "null" ]]; then
            LATEST_BUILD=$(curl -s -H "User-Agent: $USER_AGENT" \
              "https://fill.papermc.io/v3/projects/${PROJECT}/versions/${BASE_VERSION}/builds" \
              | jq -r 'map(select(.channel == "EXPERIMENTAL" or .channel == "RC")) | .[0] | .build')
            BUILD_TYPE="experimental"
          else
            BUILD_TYPE="stable"
          fi

          echo "Latest build: $LATEST_BUILD ($BUILD_TYPE)"

          echo build_number="$LATEST_BUILD"      >> $GITHUB_OUTPUT
          echo build_type="$BUILD_TYPE"          >> $GITHUB_OUTPUT
          echo build_url="https://fill.papermc.io/v3/projects/paper/versions/${BASE_VERSION}/builds/${LATEST_BUILD}" >> $GITHUB_OUTPUT
          echo download_url="https://api.papermc.io/v2/projects/paper/versions/${BASE_VERSION}/builds/${LATEST_BUILD}/downloads/paper-${BASE_VERSION}-${LATEST_BUILD}.jar" >> $GITHUB_OUTPUT

      - name: show version infos
        run: |
          echo "version: ${{ env.BASE_VERSION }}"
          echo "number:  ${{ steps.get_build.outputs.build_number }}"
          echo "type:    ${{ steps.get_build.outputs.build_type }}"
          echo "build:   ${{ steps.get_build.outputs.build_url }}"
          echo "download: ${{ steps.get_build.outputs.download_url }}"

      - name: Log in to docker.io container registry
        uses: docker/login-action@v3
        env:
          PAT: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        if: ${{ env.PAT != '' }}
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to ghcr.io container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for container image
        id: meta
        uses: docker/metadata-action@v5
        with:
          labels: |
            org.opencontainers.image.authors=Marc Tönsing <marc@marc.tv>
            org.mojang.minecraft.papermc.version=${{ env.BASE_VERSION }}
            org.mojang.minecraft.papermc.build=${{ steps.get_build.outputs.build_number }}
            org.mojang.minecraft.papermc.full_version=${{ env.BASE_VERSION }}-${{ steps.get_build.outputs.build_number }}
            org.mojang.minecraft.papermc.url=${{ steps.get_build.outputs.build_url }}
            org.mojang.minecraft.papermc.type=${{ steps.get_build.outputs.build_type }}
            org.mojang.minecraft.papermc.binary=${{ steps.get_build.outputs.download_url }}
          tags: |
            type=raw,value=${{ env.BASE_VERSION }}
            type=raw,value=${{ env.BASE_VERSION }}-${{ steps.get_build.outputs.build_number }}
            type=raw,value=latest,enable=${{ github.event.client_payload.is_latest == 'yes' }}
            type=raw,value=experimental,enable=${{ github.event.client_payload.is_experimental == 'yes' }}
          images: |
            name=docker.io/marctv/minecraft-papermc-server,enable=${{ secrets.DOCKER_HUB_ACCESS_TOKEN != '' }}
            name=ghcr.io/${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOWNLOAD_URL=${{ steps.get_build.outputs.download_url }}